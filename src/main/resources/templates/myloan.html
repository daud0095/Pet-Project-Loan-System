<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mine lån</title>
  <link rel="stylesheet" href="/css/produktside.css">
  <link rel="stylesheet" href="/css/myLoan.css">
</head>
<body>
<div class="produktside">
  <!--Venstre side (Menu)-->
  <div class="sidebar">
    <div class="titel">
      <div class="smbl"><img src="/images/loanudstyr.svg"></div>
      <header>
        Lånesystem for skoler
      </header>
    </div>
    <div class="menu">
      <div class="submenu">
        <div class="smbl"><img src="/images/udstyr.svg"></div>
        <h2><a href="/produktside">Udstyr</a></h2>
      </div>
      <div class="submenu">
        <div class="smbl"><img src="/images/minelan.svg"></div>
        <h2><a href="/myloan">Mine lån</a></h2>
      </div>

      <div class="submenu" th:if="${session.user.isAdmin}">
        <div class="smbl"><img src="/images/minelan.svg"></div>
        <h2><a href="/returnere">Afleverer</a></h2>
      </div>

      <!-- admin kan se alle brugere eller oprette ny bruger-->
      <div class="submenu" th:if="${session.user.isAdmin}">
        <div class="smbl"><img src="/images/minelan.svg"></div>
        <h2><a href="/brugere">Brugere</a></h2>
      </div>

      <div class="submenu" th:if="${session.user.isAdmin}">
        <div class="smbl"><img src="/images/minelan.svg"></div>
        <h2><a href="/administration">Administration</a></h2>
      </div>

    </div>
    <div class="logud">
      <div class="smbl"><img class="logudsmbl" src="/images/logud.svg"></div>
      <footer>
        <a href="/logout">Log ud</a>
      </footer>
    </div>
  </div>

  <!-- Mine lån skal vises -->
  <div class="produktpage">
    <div>
      <h3>Mine lån</h3>
      <div class="myLoanButtom">
        <button class="activeLoan">Aktive lån</button>
        <button class="returnLoan">Afleveret lån</button>
      </div>
      <div class="udstyrliste">
        <table>
          <thead>
          <tr>
            <th>Udstyr</th>
            <th>Låne dato</th>
            <th>Afleverings dato</th>
            <th th:if="${active}">Return dato</th>
            <th>Gebyr</th>
          </tr>
          </thead>
          <tbody>
          <div th:each="product:${products}">
            <tr>
              <td th:text="${product.name}">Computer</td>
              <td th:text="${product.loanDate}">Lån dato</td>
              <td th:text="${product.deliveryDate}">Afleveringsdato</td>
              <td th:if="${active}" th:text="${product.deliveryDate}">returndato</td>
              <td>Gebyr</td>
            </tr>
          </div>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
<script src="/js/myloan.js" defer></script>
</body>
</html>
