<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mine lån</title>
  <link rel="stylesheet" href="/css/produktside.css">
  <link rel="stylesheet" href="/css/myLoan.css">
</head>
<body>
<div class="produktside">
  <!--Venstre side (Menu)-->
  <div class="sidebar">
    <div class="titel">
      <div class="smbl"><img src="/images/loanudstyr.svg"></div>
      <header>
        Lånesystem for skoler
      </header>
    </div>
    <div class="menu">
      <div class="submenu">
        <div class="smbl"><img src="/images/udstyr.svg"></div>
        <h2><a href="/produktside">Udstyr</a></h2>
      </div>
      <div class="submenu">
        <div class="smbl"><img src="/images/minelan.svg"></div>
        <h2><a href="/myloan">Mine lån</a></h2>
      </div>

      <div class="submenu" th:if="${session.user.isAdmin}">
        <div class="smbl"><img src="/images/minelan.svg"></div>
        <h2><a href="/returnere">Afleverer</a></h2>
      </div>
    </div>
    <div class="logud">
      <div class="smbl"><img class="logudsmbl" src="/images/logud.svg"></div>
      <footer>
        <a href="/logout">Log ud</a>
      </footer>
    </div>
  </div>

  <!-- Mine lån skal vises -->
  <div class="produktpage">
    <div>
      <h3>Mine lån</h3>
      <div class="myLoanButtom">
        <a class="activeLoan" href="/myloan?filter=aktive"
           th:classappend="${filter != 'afleveret'} ? 'selected'">Aktive lån</a>
        <a class="returnLoan" href="/myloan?filter=afleveret"
           th:classappend="${filter == 'afleveret'} ? 'selected'">Afleveret lån</a>
      </div>
      <div class="udstyrliste">
        <table>
          <thead>
          <tr>
            <th>Udstyr</th>
            <th>Låne dato</th>
            <th>Afleverings dato</th>
            <th>Status</th>
          </tr>
          </thead>
          <tbody>
            <tr th:each="product:${products}">
              <td th:text="${product.name}">Computer</td>
              <td th:text="${product.loanDate}">Lån dato</td>
              <td th:text="${product.deliveryDate}">Afleveringsdato</td>
              <td th:text="${product.status}">Status</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

</body>
</html>
